<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMath review copilot</title>
<style>
  :root { --bg:#fbfaf7; --ink:#1c1b19; --muted:#6b675f; --line:#dedad0; --card:#fff;
          --ok:#1f7a4d; --warn:#9a6200; --bad:#a3312b; --spine:#1d4f91; --spine-bg:#e8f0fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --ink:#ece9e2; --muted:#9d988d; --line:#34322d; --card:#1f1e1b;
            --ok:#5fc48f; --warn:#e0a94a; --bad:#ef7f77; --spine:#8fb8f2; --spine-bg:#1e2c40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui, sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; }
  header a { color:var(--spine); font-size:.9rem; }
  header select, button.nav { font:inherit; font-size:.9rem; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; max-width:280px; }
  button.nav.primary { background:var(--spine); border-color:var(--spine); color:#fff; font-weight:600; }
  button.nav:disabled { opacity:.4; cursor:default; }
  .where { color:var(--muted); font-size:.9rem; }
  .track { height:4px; background:var(--line); } .track > div { height:100%; background:var(--ok); width:0; transition:width .2s; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:22px; max-width:1220px; margin:0 auto; padding:20px 16px 60px; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } aside { position:static !important; height:520px !important; } }
  .piece { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 26px; overflow-x:auto; }
  .crumb { color:var(--muted); font-size:.85rem; margin-bottom:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .piece h2 { margin:0 0 14px; font-size:1.35rem; }
  .plain { background:var(--spine-bg); border-radius:10px; padding:12px 14px; margin:0 0 18px; }
  .lbl { font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--spine); display:block; margin-bottom:4px; }
  .body p { margin:0 0 12px; } .body p:last-child { margin-bottom:0; }
  .tag { font-size:.68rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:1px 7px; border-radius:99px; border:1px solid currentColor; }
  .t-need { color:var(--spine); } .t-skip { color:var(--muted); }
  .by { font-size:.66rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:1px 7px; border-radius:99px;
        background:var(--spine-bg); color:var(--spine); margin-left:6px; vertical-align:middle; white-space:nowrap; }
  .plain .by { background:var(--card); }
  .by.code { background:transparent; border:1px solid var(--line); color:var(--muted); }
  details { margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  details > summary { cursor:pointer; color:var(--spine); font-weight:600; font-size:.95rem; }
  details[open] > summary { margin-bottom:10px; }
  .foot { display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; }
  aside { position:sticky; top:12px; align-self:start; height:calc(100vh - 24px); display:flex; flex-direction:column;
          background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  aside .top { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:650; }
  #msgs { flex:1; overflow:auto; padding:12px 14px; }
  .msg { margin:0 0 12px; padding:9px 12px; border-radius:10px; font-size:.95rem; overflow-x:auto; }
  .msg.you { background:var(--spine-bg); margin-left:36px; }
  .msg.bot { background:var(--bg); border:1px solid var(--line); margin-right:12px; }
  .msg.err { color:var(--bad); border-color:var(--bad); }
  .msg p { margin:0 0 8px; } .msg p:last-child { margin:0; }
  .msg pre { font-size:11.5px; max-height:260px; overflow:auto; }
  .hint { color:var(--muted); font-size:.9rem; }
  .quick { padding:8px 14px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .quick button { font:inherit; font-size:.82rem; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  .quick button:hover { border-color:var(--spine); color:var(--spine); }
  form { display:flex; gap:8px; padding:10px 14px 14px; }
  form input { flex:1; min-width:0; font:inherit; font-size:.95rem; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button.chip { font:inherit; font-size:.85rem; padding:3px 10px; margin:0 6px 6px 0; border-radius:6px; cursor:pointer;
                border:1px solid var(--spine); background:var(--spine-bg); color:var(--spine); }
  button.chip.off { border-color:var(--line); background:transparent; color:var(--muted); }
  pre { margin:0 0 8px; padding:10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow-x:auto;
        font:12.5px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  .check { border-left:3px solid var(--spine); padding:4px 0 4px 12px; margin:10px 0; font-size:.95rem; }
  .flag { border-left:3px solid var(--warn); padding:4px 0 4px 12px; margin:8px 0; font-size:.92rem; }
  .flag.mismatch { border-left-color:var(--bad); }
  .muted { color:var(--muted); font-size:.92rem; }
  .float { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0; overflow-x:auto; }
  .float table { border-collapse:collapse; width:100%; margin-bottom:8px; }
  .float td { border-top:1px solid var(--line); padding:6px 10px 6px 0; vertical-align:top; font-size:.92rem; }
  .float td p, .float .muted p { margin:0; }
  .msg img { display:block; width:100%; border-radius:8px; margin-top:6px; background:#fff; cursor:zoom-in; }
  .msg img.big { position:fixed; inset:4vh 4vw; width:92vw; height:92vh; object-fit:contain; z-index:10; cursor:zoom-out; box-shadow:0 0 0 100vmax rgba(0,0,0,.7); }
  .viz input { width:70px; font:inherit; padding:2px 6px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
  .viz svg { display:block; width:100%; height:auto; margin:8px 0; }
  .viz .eq { font-variant-numeric:tabular-nums; }
</style>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], tags: 'none',
    macros: { N: '\\mathbb N', Z: '\\mathbb Z', R: '\\mathbb R', E: '\\mathbb E', Prob: '\\mathbb P', e: '\\mathrm e' } } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<header>
  <h1>Review copilot</h1>
  <button class="nav" id="prev">← Previous</button>
  <select id="jump" aria-label="Jump to a result"></select>
  <button class="nav" id="next">Next →</button>
  <span class="where" id="where"></span>
  <a href="index.html" style="margin-left:auto">Summary card</a>
</header>
<div class="track"><div id="trackfill"></div></div>
<div class="layout">
  <main><div class="piece" id="piece"></div></main>
  <aside>
    <div class="top">Ask the copilot about this step <span class="by">Agent37</span></div>
    <div id="msgs"></div>
    <div class="quick" id="quick"></div>
    <form id="ask"><input id="q" placeholder="Ask anything about this step…" maxlength="600" autocomplete="off"><button class="nav primary" id="send">Ask</button></form>
  </aside>
</div>
<script src="card.js"></script>
<script src="audit.js"></script>
<script src="notes.js"></script>
<script>
(function () {
  const card = window.CARD, au = window.AUDIT, notes = (window.NOTES && window.NOTES.notes) || {};
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  if (!card) { $('piece').textContent = 'card.js is missing. Run the agent first.'; return; }
  const SVG = 'http://www.w3.org/2000/svg';
  const svg = (tag, attrs, text) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const by = (name, code) => el('span', 'by' + (code ? ' code' : ''), name);
  let mjQueue = Promise.resolve();
  const typeset = (node) => { mjQueue = mjQueue.then(() => (window.MathJax && MathJax.typesetPromise) ? MathJax.typesetPromise([node]) : null).catch(() => {}); };

  const nodes = new Map(card.map.nodes.map((n) => [n.label, n]));
  const needed = new Set(card.spine);
  const usedBy = new Map(card.map.nodes.map((n) => [n.label, []]));
  for (const n of card.map.nodes) for (const d of n.deps) usedBy.get(d).push(n.label);
  const order = card.spine.concat(card.map.nodes.map((n) => n.label).filter((l) => !needed.has(l)));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const short = (label) => label.replace(/^[a-z]+:/, '').replace(/-/g, ' ');
  // A readable name for a result: its own title, or its label without the prefix.
  const nice = (label) => { const n = nodes.get(label); return n ? cap(n.kind) + ' “' + (n.title || short(label)) + '”' : '“' + short(label) + '”'; };

  const KEY = 'openmath-reviewed-' + card.paper;
  let reviewed = new Set();
  try { reviewed = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { /* storage unavailable */ }
  const saveReviewed = () => { try { localStorage.setItem(KEY, JSON.stringify([...reviewed])); } catch (e) { /* storage unavailable */ } };

  // ---- LaTeX to readable text. Maths segments are kept for MathJax; only the prose around them is rewritten.
  const ACCENT = { 'H': { o: 'ő', u: 'ű', O: 'Ő', U: 'Ű' }, '"': { a: 'ä', o: 'ö', u: 'ü', e: 'ë', i: 'ï', A: 'Ä', O: 'Ö', U: 'Ü' },
    "'": { a: 'á', e: 'é', i: 'í', o: 'ó', u: 'ú', y: 'ý', c: 'ć', n: 'ń', s: 'ś', z: 'ź', E: 'É', A: 'Á', O: 'Ó' }, '`': { a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù' },
    '^': { a: 'â', e: 'ê', i: 'î', o: 'ô', u: 'û' }, '~': { n: 'ñ', a: 'ã', o: 'õ' }, 'c': { c: 'ç', s: 'ş' }, 'v': { c: 'č', s: 'š', z: 'ž', r: 'ř', e: 'ě' }, 'u': { a: 'ă', g: 'ğ' } };
  const MATH = /\$\$[\s\S]*?\$\$|\$[^$]*\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\\begin\{(equation|align|aligned|gather|multline|eqnarray|cases)(\*?)\}[\s\S]*?\\end\{\1\2\}/g;
  const citeName = (keys) => '(' + keys.split(',').map((k) => k.trim().replace(/([a-z])([A-Z])/g, '$1 & $2').replace(/([A-Za-z])(\d{4})/, '$1 $2')).join('; ') + ')';
  function prose(t) {
    return t
      .replace(/\\label\{[^}]*\}/g, '')
      .replace(/\\([H"'`^~cvu])\{([A-Za-z])\}/g, (m, a, ch) => (ACCENT[a] && ACCENT[a][ch]) || ch)
      .replace(/\\(["'`^~])([A-Za-z])/g, (m, a, ch) => (ACCENT[a] && ACCENT[a][ch]) || ch)
      .replace(/\\cite(?:\[([^\]]*)\])?\{([^}]*)\}/g, (m, opt, keys) => citeName(keys))
      .replace(/\\eqref\{([^}]*)\}/g, (m, l) => 'the display “' + short(l) + '”')
      .replace(/(Theorems?|Lemmas?|Propositions?|Corollary|Corollaries|Sections?)[~\s]*\\(?:c|C|auto)?ref\{([^}]*)\}/g, (m, k, l) => nodes.has(l) ? nice(l) : k + ' “' + short(l) + '”')
      .replace(/\\(?:c|C|auto)?ref\{([^}]*)\}/g, (m, l) => nodes.has(l) ? nice(l) : '“' + short(l) + '”')
      .replace(/\\footnote\{([^{}]*)\}/g, ' ($1)')
      .replace(/\\(?:emph|textit|textbf|textup|textrm|texttt|textsc|mbox|text)\{([^{}]*)\}/g, '$1')
      .replace(/\\(?:begin|end)\{(?:itemize|enumerate|description|center|quote)\}(?:\[[^\]]*\])?/g, '\n\n')
      .replace(/\\item\s*\[([^\]]*)\]/g, '\n\n$1 ')
      .replace(/\\item\b/g, '\n\n• ')
      .replace(/\\(?:noindent|medskip|smallskip|bigskip|qedhere|par|newline|linebreak|quad|qquad|hfill|centering)\b/g, ' ')
      .replace(/\\(?:vspace|hspace)\*?\{[^}]*\}/g, ' ')
      .replace(/\\paragraph\{([^{}]*)\}/g, '\n\n$1. ')
      .replace(/``|''/g, (q) => (q === '``' ? '“' : '”'))
      .replace(/---/g, '—').replace(/--/g, '–')
      .replace(/\\([%&_#])/g, '$1').replace(/\\ldots|\\dots/g, '…')
      .replace(/\\\\/g, '\n').replace(/\\[ ,;]/g, ' ').replace(/~/g, ' ')
      .replace(/[{}]/g, '');
  }
  function readable(tex) {
    let out = '', last = 0;
    for (const m of tex.matchAll(MATH)) {
      out += prose(tex.slice(last, m.index)) + m[0].replace(/\\label\{[^}]*\}/g, '');
      last = m.index + m[0].length;
    }
    return out + prose(tex.slice(last));
  }
  // Model-written text sometimes arrives with doubled backslashes or bare TeX outside delimiters.
  function tidyModel(t) {
    t = t.replace(/\\\\(?=[()\[\]a-zA-Z])/g, '\\');
    let out = '', last = 0;
    const bare = (s) => s.replace(/([A-Za-z0-9]+(?:[_^](?:\{[^{}]*\}|[A-Za-z0-9]))+|\\[a-zA-Z]+(?:\{[^{}]*\})*)/g, '\\($1\\)');
    for (const m of t.matchAll(MATH)) { out += bare(t.slice(last, m.index)) + m[0]; last = m.index + m[0].length; }
    return out + bare(t.slice(last));
  }
  const FLOAT = /\\begin\{(figure|table)\*?\}[\s\S]*?\\end\{\1\*?\}/g;
  function textInto(box, tex) { for (const part of readable(tex).split(/\n\s*\n/)) if (part.trim()) box.append(el('p', null, part.replace(/[ \t]+/g, ' ').trim())); }
  // A paper figure or table: tables are rebuilt as real tables; TikZ drawings cannot be drawn here, so the caption is shown.
  function floatBox(tex, kind) {
    const box = el('div', 'float'), cap = /\\caption\{((?:[^{}]|\{[^{}]*\})*)\}/.exec(tex), tab = /\\begin\{tabular\}\{[^}]*\}([\s\S]*?)\\end\{tabular\}/.exec(tex);
    box.append(el('span', 'lbl', kind === 'table' ? 'Table from the paper' : 'Figure from the paper'));
    if (tab) {
      const t = el('table');
      for (const row of tab[1].replace(/\\(?:hline|toprule|midrule|bottomrule)\b/g, '').split(/\\\\/)) {
        if (!row.trim()) continue;
        const tr = el('tr');
        for (const cell of row.split(/(?<!\\)&/)) { const td = el('td'); textInto(td, cell); tr.append(td); }
        t.append(tr);
      }
      box.append(t);
    } else box.append(el('p', 'muted', 'This is a drawing in the paper’s PDF that this page cannot redraw. Ask the copilot to draw it for you.'));
    if (cap) { const c = el('div', 'muted'); textInto(c, cap[1]); box.append(c); }
    return box;
  }
  function paragraphs(tex, cls) {
    const box = el('div', cls || 'body');
    let last = 0;
    for (const m of tex.matchAll(FLOAT)) { textInto(box, tex.slice(last, m.index)); box.append(floatBox(m[0], m[1])); last = m.index + m[0].length; }
    textInto(box, tex.slice(last));
    return box;
  }

  // ---- exact shortest expansion (same search as agent/explore.py), for the picture
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
  function search(p, q, terms, lowest) {
    if (terms === 1) return q % p === 0n && q / p >= lowest ? [q / p] : null;
    let n = q / p + 1n; if (n < lowest) n = lowest;
    const stop = BigInt(terms) * q / p;
    for (; n <= stop; n++) { const np = p * n - q, nq = q * n, g = gcd(np, nq); const rest = search(np / g, nq / g, terms - 1, n + 1n); if (rest) return [n].concat(rest); }
    return null;
  }
  function shortest(a, b) { const g = gcd(BigInt(a), BigInt(b)); for (let t = 1; t <= 7; t++) { const r = search(BigInt(a) / g, BigInt(b) / g, t, 2n); if (r) return r; } return null; }
  function visual(a0, b0, compact) {
    const ex = card.explore, box = el('div', 'viz');
    const row = el('div'), ia = el('input'), ib = el('input');
    for (const [inp, v] of [[ia, a0 || 77], [ib, b0 || 79]]) { inp.type = 'number'; inp.min = 1; inp.max = ex.b_max; inp.value = v; }
    row.append(document.createTextNode('Fill a glass to '), ia, document.createTextNode(' / '), ib, document.createTextNode('  with cups 1/2, 1/3, 1/4, … used once each'));
    const glass = svg('svg', { viewBox: '0 0 600 64', role: 'img' }), eq = el('div', 'eq');
    const chart = svg('svg', { viewBox: '0 0 600 170', role: 'img' });
    box.append(row, glass, eq);
    if (!compact) box.append(el('p', 'muted', 'Most cups needed for each denominator b. It barely climbs: that is the theorem.'), chart);
    const max = Math.max(...ex.series.map((s) => s[1]));
    const X = (b) => 34 + (b - 2) * (556 / (ex.b_max - 2)), Y = (k) => 150 - k * (130 / max);
    function drawChart(bSel) {
      chart.replaceChildren();
      for (let k = 1; k <= max; k++) { chart.append(svg('line', { x1: 34, x2: 590, y1: Y(k), y2: Y(k), stroke: 'var(--line)' })); chart.append(svg('text', { x: 26, y: Y(k) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, k)); }
      for (const b of [2, 50, 100, 150, 200]) chart.append(svg('text', { x: Math.min(X(b), 578), y: 166, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, 'b=' + b));
      for (const [b, k] of ex.series) chart.append(svg('circle', { cx: X(b), cy: Y(k), r: b === bSel ? 5 : 2.2, fill: b === bSel ? 'var(--warn)' : 'var(--spine)' }));
    }
    const palette = ['#1d4f91', '#3f7fc4', '#7fb0e6', '#b9792b', '#d9a45a', '#8a5aa8', '#b790cf'];
    function draw() {
      const a = parseInt(ia.value, 10), b = parseInt(ib.value, 10);
      glass.replaceChildren();
      if (!(a >= 1 && b <= ex.b_max && a < b)) { eq.textContent = 'Choose whole numbers with 1 ≤ a < b ≤ ' + ex.b_max + '.'; drawChart(null); return; }
      const ns = shortest(a, b);
      if (!ns) { eq.textContent = 'No expansion with at most 7 cups found.'; drawChart(b); return; }
      glass.append(svg('rect', { x: 0, y: 8, width: 600, height: 34, fill: 'none', stroke: 'var(--line)' }));
      let x = 0;
      ns.forEach((n, i) => { const w = 600 / Number(n); glass.append(svg('rect', { x: x, y: 8, width: Math.max(w, 0.6), height: 34, fill: palette[i % palette.length] })); if (w > 26) glass.append(svg('text', { x: x + w / 2, y: 30, 'text-anchor': 'middle', 'font-size': 13, fill: '#fff' }, '1/' + n)); x += w; });
      const mark = 600 * a / b;
      glass.append(svg('line', { x1: mark, x2: mark, y1: 2, y2: 48, stroke: 'var(--warn)', 'stroke-width': 2 }));
      glass.append(svg('text', { x: Math.min(Math.max(mark, 20), 575), y: 60, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--warn)' }, a + '/' + b));
      eq.textContent = a + '/' + b + ' = ' + ns.map((n) => '1/' + n).join(' + ') + '   →  ' + ns.length + ' cup' + (ns.length > 1 ? 's' : '') + ' (the fewest possible)';
      drawChart(b);
    }
    ia.oninput = draw; ib.oninput = draw; draw();
    return box;
  }

  // Where the current step sits: the results the main theorem needs, by depth, with this one lit.
  function treeVisual(current) {
    const depth = new Map([[card.root, 0]]), queue = [card.root];
    for (let i = 0; i < queue.length; i++) for (const d of nodes.get(queue[i]).deps) if (!depth.has(d)) { depth.set(d, depth.get(queue[i]) + 1); queue.push(d); }
    const rows = []; for (const [l, d] of depth) (rows[d] = rows[d] || []).push(l);
    const W = 640, RH = 62, H = rows.length * RH + 6, pos = new Map();
    rows.forEach((r, d) => r.forEach((l, i) => pos.set(l, { x: W * (i + 1) / (r.length + 1), y: d * RH + 24 })));
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
    for (const [l, pt] of pos) for (const d of nodes.get(l).deps) { const q = pos.get(d); if (q) s.append(svg('line', { x1: pt.x, y1: pt.y + 13, x2: q.x, y2: q.y - 13, stroke: (l === current || d === current) ? 'var(--spine)' : 'var(--line)', 'stroke-width': (l === current || d === current) ? 2 : 1 })); }
    for (const [l, pt] of pos) {
      const name = (nodes.get(l).title || short(l)), text = name.length > 22 ? name.slice(0, 21) + '…' : name, w = Math.max(70, text.length * 6.6 + 16), on = l === current;
      const g = svg('g', { style: 'cursor:pointer' });
      g.append(svg('rect', { x: pt.x - w / 2, y: pt.y - 13, width: w, height: 26, rx: 6, fill: on ? 'var(--spine)' : 'var(--card)', stroke: reviewed.has(l) ? 'var(--ok)' : 'var(--spine)', 'stroke-width': reviewed.has(l) ? 2 : 1 }));
      g.append(svg('text', { x: pt.x, y: pt.y + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: on ? '#fff' : 'var(--ink)' }, text));
      g.addEventListener('click', () => go(order.indexOf(l)));
      s.append(g);
    }
    const box = el('div', 'viz');
    box.append(s, el('p', 'muted', 'Main theorem on top; a line means “uses”. Filled: you are here. Green: reviewed. Click to jump.'));
    return box;
  }

  // The greedy procedure the lemma is about: always take the biggest cup that fits.
  function greedyVisual(a0, b0) {
    const box = el('div', 'viz'), row = el('div'), ia = el('input'), ib = el('input'), out = el('div');
    for (const [inp, v] of [[ia, a0 || 5], [ib, b0 || 121]]) { inp.type = 'number'; inp.min = 1; inp.max = 500; inp.value = v; }
    row.append(document.createTextNode('Pour '), ia, document.createTextNode(' / '), ib, document.createTextNode('  greedily: always the biggest cup that fits'));
    box.append(row, out);
    function draw() {
      const a1 = parseInt(ia.value, 10), b1 = parseInt(ib.value, 10);
      out.replaceChildren();
      if (!(a1 >= 1 && a1 < b1 && b1 <= 500)) { out.append(el('p', 'muted', 'Choose whole numbers with 1 ≤ a < b ≤ 500.')); return; }
      let A = BigInt(a1), C = BigInt(b1); const steps = [];
      while (A > 0n && steps.length < 12) { const z = (C + A - 1n) / A; steps.push({ z, C }); const nA = A * z - C, nC = C * z, g = gcd(nA, nC) || 1n; A = nA / g; C = nC / g; }
      const maxDigits = Math.max(...steps.map((s) => s.z.toString().length));
      const s = svg('svg', { viewBox: '0 0 600 ' + (steps.length * 26 + 8), role: 'img' });
      steps.forEach((st, i) => {
        const digits = st.z.toString().length, w = Math.max(6, 300 * digits / maxDigits), zs = st.z.toString();
        s.append(svg('text', { x: 0, y: i * 26 + 18, 'font-size': 12, fill: 'var(--muted)' }, 'cup ' + (i + 1)));
        s.append(svg('rect', { x: 50, y: i * 26 + 5, width: w, height: 17, rx: 3, fill: 'var(--warn)' }));
        s.append(svg('text', { x: 58 + w, y: i * 26 + 18, 'font-size': 12, fill: 'var(--ink)' }, '1/' + (zs.length > 16 ? zs.slice(0, 6) + '…' + zs.slice(-3) + ' (' + zs.length + ' digits)' : zs)));
      });
      const best = b1 <= 200 ? shortest(a1, b1) : null;
      out.append(s, el('p', null, 'Greedy: ' + steps.length + (A > 0n ? '+' : '') + ' cups, denominators roughly squaring each step.' +
        (best ? ' Fewest possible: ' + best.length + '.' : '')));
    }
    ia.oninput = draw; ib.oninput = draw; draw();
    return box;
  }

  function fold(title, badge, build, open) {
    const d = el('details'), s = el('summary', null, title);
    if (badge) s.append(badge);
    d.append(s);
    const fill = () => { if (d.childElementCount === 1) { const c = build(); d.append(c); typeset(c); } };
    d.addEventListener('toggle', () => { if (d.open) fill(); });
    if (open) { d.open = true; fill(); }
    return d;
  }
  function chips(labels) {
    const box = el('div');
    if (!labels.length) { box.append(el('span', 'muted', 'nothing')); return box; }
    for (const l of labels) { const b = el('button', 'chip' + (needed.has(l) ? '' : ' off'), nice(l)); b.onclick = () => go(order.indexOf(l)); box.append(b); }
    return box;
  }

  let at = 0;
  const chats = new Map();  // label -> [{who, text}]
  function go(i) {
    if (i < 0 || i >= order.length) return;
    at = i;
    const label = order[i], n = nodes.get(label), isNeeded = needed.has(label), note = notes[label], p = $('piece');
    p.replaceChildren();
    const crumb = el('div', 'crumb');
    crumb.append(el('span', null, n.section || 'Paper'), el('span', 'tag ' + (isNeeded ? 't-need' : 't-skip'), isNeeded ? 'needed' : 'optional'));
    p.append(crumb, el('h2', null, cap(n.kind) + (n.title ? ': ' + n.title : label === card.root ? ': the main result' : ' “' + short(label) + '”')));

    if (note && !note.error) { const box = el('div', 'plain'), l = el('span', 'lbl', 'In plain words'); l.append(by('Agent37')); box.append(l, paragraphs(tidyModel(note.role))); p.append(box); }
    p.append(el('span', 'lbl', 'The paper says'), paragraphs(n.statement));

    if (label === card.root && card.explore) p.append(fold('See it with numbers', by('exact', true), () => visual(), true));
    if (label === 'lem:greedy') p.append(fold('See it with numbers', by('exact', true), () => greedyVisual(), true));
    if (isNeeded) p.append(fold('Where this sits in the argument', null, () => treeVisual(label), label !== card.root));
    if (n.proof) p.append(fold('Proof (' + n.proof.split(/\s+/).length.toLocaleString() + ' words)', null, () => paragraphs(n.proof)));
    if (note && !note.error && note.checks.length) p.append(fold('What to check here (' + note.checks.length + ')', by('Agent37'), () => {
      const c = el('div');
      for (const ch of note.checks) { const d = el('div', 'check'); d.append(paragraphs(tidyModel(ch.point))); c.append(d); }
      if (note.rejected) c.append(el('p', 'muted', note.rejected + ' more suggestion' + (note.rejected > 1 ? 's were' : ' was') + ' dropped because the quoted text was not in the paper.'));
      return c;
    }));
    if (!isNeeded) p.append(fold('How it connects', null, () => {
      const c = el('div');
      c.append(el('p', 'muted', 'It relies on:'), chips(n.deps), el('p', 'muted', 'It is used by:'), chips(usedBy.get(label)));
      return c;
    }));
    if (label === card.root && card.formal) p.append(fold('Computer-checked version', by('Agent37 audit'), () => {
      const c = el('div');
      c.append(el('p', 'muted', 'The formal statement the source says is proved (not rebuilt by us).'), el('pre', null, card.formal.theorem));
      if (au) { const mism = au.original.flags.filter((f) => f.severity === 'mismatch').length;
        c.append(el('p', 'muted', 'Compared with the statement above: ' + mism + ' mismatches, ' + (au.original.flags.length - mism) + ' notes.'));
        for (const f of au.original.flags) { const d = el('div', 'flag ' + f.severity); d.append(paragraphs(tidyModel(f.summary))); c.append(d); } }
      return c;
    }));

    const foot = el('div', 'foot'), done = el('button', 'nav primary', reviewed.has(label) ? 'Reviewed ✓  Next →' : 'Mark reviewed and continue →');
    done.onclick = () => { reviewed.add(label); saveReviewed(); go(at < order.length - 1 ? at + 1 : at); };
    foot.append(done);
    if (reviewed.has(label)) { const undo = el('button', 'nav', 'Undo'); undo.onclick = () => { reviewed.delete(label); saveReviewed(); go(at); }; foot.append(undo); }
    p.append(foot);
    typeset(p);

    $('prev').disabled = i === 0; $('next').disabled = i === order.length - 1;
    $('jump').value = label;
    const doneCount = card.spine.filter((x) => reviewed.has(x)).length;
    $('where').textContent = (isNeeded ? 'Step ' + (i + 1) + ' of ' + card.spine.length : 'Optional ' + (i + 1 - card.spine.length) + ' of ' + (order.length - card.spine.length)) + ' · ' + doneCount + ' of ' + card.spine.length + ' reviewed';
    $('trackfill').style.width = (100 * doneCount / card.spine.length) + '%';
    renderChat();
    window.scrollTo(0, 0);
  }

  // ---- chat
  function renderChat() {
    const label = order[at], box = $('msgs'), log = chats.get(label) || [];
    box.replaceChildren();
    if (!log.length) box.append(el('p', 'hint', 'Ask about this step, or have the agent test it by running code.'));
    for (const m of log) { const d = el('div', 'msg ' + m.who); if (m.drawing) { if (m.drawing.caption) d.append(paragraphs(tidyModel(m.drawing.caption))); const img = el('img'); img.alt = m.drawing.caption || 'Picture generated by the agent'; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(m.drawing.svg); img.onclick = () => img.classList.toggle('big'); d.append(img, el('p', 'muted', 'Generated just now: the agent computed the data and drew this in its Agent37 sandbox. Click to enlarge.')); } else if (m.spec) { d.append(paragraphs(tidyModel(m.spec.caption))); if (m.spec.picture !== 'none') d.append(m.spec.picture === 'greedy' ? greedyVisual(m.spec.a, m.spec.b) : visual(m.spec.a, m.spec.b, true), el('p', 'muted', 'Picture and fraction chosen by the agent; drawn exactly by the page.')); } else d.append(m.who === 'you' ? el('p', null, m.text) : rich(m.text)); if (m.ran) d.append(el('p', 'muted', 'Run in the agent’s Agent37 sandbox; output as it reported.')); box.append(d); }
    typeset(box);
    box.scrollTop = box.scrollHeight;
  }
  // Agent replies: fenced blocks become code, the rest readable text.
  function rich(text) {
    const box = el('div');
    text.split(/```[a-z]*\n?/).forEach((part, i) => { if (!part.trim()) return; box.append(i % 2 ? el('pre', null, part.replace(/\s+$/, '')) : paragraphs(tidyModel(part))); });
    return box;
  }
  let busy = false;
  async function ask(question, mode) {
    question = question.trim();
    if (!question || busy) return;
    const label = order[at], log = chats.get(label) || [];
    chats.set(label, log);
    log.push({ who: 'you', text: question }, { who: 'bot', text: mode === 'test' ? 'Writing a test and running it on Agent37. This takes about half a minute…' : mode === 'show' ? 'Choosing a picture for this step…' : mode === 'draw' ? 'Computing data and drawing a new picture on Agent37. About half a minute…' : 'Thinking…' });
    busy = true; $('send').disabled = true; $('q').value = '';
    renderChat();
    let reply = { who: 'bot err', text: 'The copilot is not reachable. Start it with: python -m agent.server' };
    try {
      const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label, question, mode: mode || 'ask' }) });
      const data = await res.json();
      reply = data.success ? { who: 'bot', text: data.data.answer, ran: mode === 'test', spec: data.data.spec, drawing: data.data.drawing } : { who: 'bot err', text: data.error || 'Something went wrong.' };
    } catch (e) { /* keep the unreachable message */ }
    log[log.length - 1] = reply;
    busy = false; $('send').disabled = false;
    if (order[at] === label) renderChat();
  }
  $('ask').onsubmit = (e) => { e.preventDefault(); ask($('q').value); };
  { const b = el('button', null, '▶ Test this step by experiment'); b.type = 'button'; b.title = 'The agent writes a script and runs it in its Agent37 cloud sandbox'; b.style.borderColor = 'var(--spine)'; b.style.color = 'var(--spine)'; b.onclick = () => ask('Test this step on small cases.', 'test'); $('quick').append(b); }
  { const b = el('button', null, '◐ Interactive picture'); b.type = 'button'; b.style.borderColor = 'var(--spine)'; b.style.color = 'var(--spine)'; b.onclick = () => ask('Show me a picture for this step.', 'show'); $('quick').append(b); }
  { const b = el('button', null, '✎ Draw this for me'); b.type = 'button'; b.title = 'The agent computes data and generates a new 2D or 3D picture'; b.style.borderColor = 'var(--spine)'; b.style.color = 'var(--spine)'; b.onclick = () => ask($('q').value.trim() || 'Draw a picture that makes this step intuitive. Use 3D if the data has two inputs.', 'draw'); $('quick').append(b); }
  for (const q of ['Explain this step simply', 'Why is this needed?', 'Give a small example', 'What could go wrong here?']) { const b = el('button', null, q); b.type = 'button'; b.onclick = () => ask(q); $('quick').append(b); }

  // ---- navigation
  const g1 = document.createElement('optgroup'), g2 = document.createElement('optgroup');
  g1.label = 'Review path'; g2.label = 'Optional';
  order.forEach((l, i) => { const o = el('option', null, (needed.has(l) ? (i + 1) + '. ' : '') + nice(l)); o.value = l; (needed.has(l) ? g1 : g2).append(o); });
  $('jump').append(g1, g2);
  $('jump').onchange = () => go(order.indexOf($('jump').value));
  $('prev').onclick = () => go(at - 1);
  $('next').onclick = () => go(at + 1);
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') go(at + 1); if (e.key === 'ArrowLeft') go(at - 1); });
  go(0);
})();
</script>
</body>
</html>
